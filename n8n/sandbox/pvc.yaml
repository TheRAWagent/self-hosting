apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-tls-pvc
  namespace: n8n
spec:
  # Holds the mTLS certs generated by the sandbox-certs Job; shared (RWO)
  # by the sandbox-api and sandbox-runner Deployments, which must land on
  # the same node (fine on a single-node MicroK8s cluster)
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 10Mi

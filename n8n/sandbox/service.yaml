# Internal-only services for the sandbox stack (ClusterIP, no LAN exposure).
apiVersion: v1
kind: Service
metadata:
  name: sandbox-api
  namespace: n8n
spec:
  type: ClusterIP
  selector:
    app: sandbox-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 9090
    targetPort: 9090

---
# Name must stay sandbox-runner-1: it matches the TLS cert SAN generated by
# the certs Job and the addresses the runner advertises.
apiVersion: v1
kind: Service
metadata:
  name: sandbox-runner-1
  namespace: n8n
spec:
  type: ClusterIP
  selector:
    app: sandbox-runner-1
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: control-grpc
    port: 9091
    targetPort: 9091

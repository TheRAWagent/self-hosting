# Control plane n8n talks to when the AI Assistant needs to run code.
# ClusterIP-only: never expose 8080/9090 to the LAN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-api
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-api
  template:
    metadata:
      labels:
        app: sandbox-api
    spec:
      initContainers:
      # Wait for the sandbox-certs Job to finish populating the shared PVC
      - name: wait-for-certs
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
        - until [ -f /tls/api/grpc-server.crt ]; do echo "waiting for certs"; sleep 3; done
        volumeMounts:
        - name: sandbox-tls
          mountPath: /tls
      containers:
      - name: sandbox-api
        image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.2.0
        imagePullPolicy: IfNotPresent
        env:
        # n8n authenticates with N8N_SANDBOX_SERVICE_API_KEY, which must
        # match one of the keys listed here
        - name: SANDBOX_API_KEYS
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: sandbox-api-keys
        # Credentials the API presents to the runner (registration + control gRPC)
        - name: SANDBOX_API_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: sandbox-api-runner-registration-token
        - name: SANDBOX_API_RUNNER_API_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: sandbox-api-runner-api-key
        - name: SANDBOX_API_GRPC_TLS_CERT_FILE
          value: /tls/api/grpc-server.crt
        - name: SANDBOX_API_GRPC_TLS_KEY_FILE
          value: /tls/api/grpc-server.key
        - name: SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE
          value: /tls/api/ca.crt
        - name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE
          value: /tls/api/ca.crt
        - name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE
          value: /tls/api/control-grpc-api-client.crt
        - name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE
          value: /tls/api/control-grpc-api-client.key
        - name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME
          value: sandbox-runner-1
        ports:
        - containerPort: 8080
        - containerPort: 9090
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: sandbox-tls
          mountPath: /tls
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1"
      volumes:
      - name: sandbox-tls
        persistentVolumeClaim:
          claimName: sandbox-tls-pvc
          readOnly: true

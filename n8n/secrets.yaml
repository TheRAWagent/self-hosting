apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
spec: {}
data:
  db-nonroot-password: <DB_NONROOT_PASSWORD>
  db-nonroot-user: <DB_NONROOT_USER>
  db-root-password: <DB_ROOT_PASSWORD>
  db-user: <DB_USER>
  encryption-key: <ENCRYPTION_KEY>
  n8n-runners-auth-token: <N8N_RUNNERS_AUTH_TOKEN>
  n8n-sandbox-service-api-key: <N8N_SANDBOX_SERVICE_API_KEY>
  # Must include the same value as n8n-sandbox-service-api-key above —
  # that is how n8n authenticates to the sandbox
  sandbox-api-keys: <SANDBOX_API_KEYS>
  sandbox-api-runner-registration-token: <SANDBOX_API_RUNNER_REGISTRATION_TOKEN>
  sandbox-api-runner-api-key: <SANDBOX_API_RUNNER_API_KEY>
  searxng-secret: <SEARXNG_SECRET>
type: Opaque

apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: docker.n8n.io/n8nio/n8n:stable
        imagePullPolicy: Always
        env:
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: postgres-svc
        - name: DB_POSTGRESDB_PORT
          value: "5432"
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-nonroot-user
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: db-nonroot-password
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: encryption-key
        - name: N8N_HOST
          value: n8n.dhairya.co
        - name: N8N_PORT
          value: "80"
        - name: N8N_RUNNERS_MODE
          value: "external"
        - name: N8N_RUNNERS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: n8n-runners-auth-token
        - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
          value: "0.0.0.0"
        # n8n Assistant: sandbox for AI-generated code + SearXNG web search
        - name: N8N_INSTANCE_AI_SANDBOX_ENABLED
          valueFrom:
            configMapKeyRef:
              name: n8n-config
              key: n8n-instance-ai-sandbox-enabled
        - name: N8N_SANDBOX_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: n8n-config
              key: n8n-sandbox-service-url
        - name: N8N_SANDBOX_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: n8n-sandbox-service-api-key
        - name: N8N_INSTANCE_AI_SEARXNG_URL
          valueFrom:
            configMapKeyRef:
              name: n8n-config
              key: n8n-instance-ai-searxng-url
        - name: NODE_FUNCTIONS_ALLOW_EXTERNAL
          valueFrom:
            configMapKeyRef:
              name: n8n-config
              key: node-functions-allow-external
        resources:
          limits:
            memory: "2Gi"
            cpu: "2"
          requests:
            memory: "1Gi"
            cpu: "1"
        ports:
        - containerPort: 5678
        - containerPort: 5679
        volumeMounts:
          - name: n8n-storage
            mountPath: /home/node/.n8n
      volumes:
        - name:  n8n-storage
          persistentVolumeClaim:
            claimName: n8n-pvc
            readOnly: false
